version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Plain `yarn install` (not --frozen-lockfile) so a minor lockfile drift
        # can't fail the build the way it did before.
        - yarn install
    build:
      commands:
        # Amplify variables exist at build time only. Write the server-side ones to
        # .env.production so the running server (API routes) can read them.
        - node scripts/write-env.js
        - yarn build
  artifacts:
    # .next as baseDirectory tells Amplify to deploy this as a Next.js SSR app.
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
